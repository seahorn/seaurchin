name: Build Rust Dist Container

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - dev-18

jobs:
  build-rust-dist:
    if: github.repository_owner == 'seahorn'
    runs-on: seaurchin-big
    container:
      image: ghcr.io/seahorn/seaurchin-llvm/buildpack-deps-seaurchin:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write
      contents: write
    env:
      LLVM_ARTIFACT_DIR: seaurchin-llvm
      LLVM_ARTIFACT_FILE: seaurchin-llvm-assert-install-dev18.tar.zst
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS_NOT_BOOTSTRAP: >-
        -Cllvm-args=-licm-uses-ownsem
        -Cllvm-args=-licm-ownsem-safeset-ignores-throw
        -Cllvm-args=-licm-ownsem-safeset-store-threadsafe

    steps:
      - name: Checkout seaurchin
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            src/doc/book \
            src/doc/nomicon \
            src/doc/reference \
            src/doc/rust-by-example \
            src/doc/embedded-book \
            src/doc/edition-guide \
            src/doc/rustc-dev-guide \
            src/tools/cargo \
            library/backtrace \
            library/stdarch

      - name: Get latest successful run ID from seaurchin-llvm
        id: get_seaurchin_llvm_run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: 'seahorn',
              repo: 'seaurchin-llvm',
              workflow_id: 'build-seaurchin-llvm-assert-bin.yml',
              branch: 'dev-18',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              throw new Error('No successful runs found');
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);

      - name: Download seaurchin-llvm-install artifact
        uses: actions/download-artifact@v4
        with:
          name: seaurchin-llvm-assert-install
          path: ${{ env.LLVM_ARTIFACT_DIR }}
          run-id: ${{ steps.get_seaurchin_llvm_run.outputs.run_id }}
          repository: seahorn/seaurchin-llvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack seaurchin-llvm install
        run: |
          mkdir -p /tmp/mnt
          tar --zstd -C "$LLVM_ARTIFACT_DIR" -xf "$LLVM_ARTIFACT_DIR/$LLVM_ARTIFACT_FILE"
          rm "$LLVM_ARTIFACT_DIR/$LLVM_ARTIFACT_FILE"

      - name: Build Rust
        run: python3 x.py --config=config.ci.toml install

      - name: Run Rust UI tests
        run: python3 x.py --config=config.ci.toml --stage 2 --target x86_64-unknown-linux-gnu test tests/ui

      - name: Package seaurchin dist
        run: tar -C /tmp/mnt/ -c install/ | zstd -T0 -c > seaurchin-dist.tar.zst

      - name: Upload seaurchin dist
        uses: actions/upload-artifact@v4
        with:
          name: seaurchin-dist
          path: seaurchin-dist.tar.zst
          retention-days: 30

      - name: Delete previous dev-18-latest release and tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'dev-18-latest';
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

      - name: Publish seaurchin dist as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-18-latest
          target_commitish: ${{ github.sha }}
          name: seaurchin dist (dev-18 rolling)
          body: |
            Rolling build of seaurchin dist from branch `dev-18`.
            Built from commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: seaurchin-dist.tar.zst
