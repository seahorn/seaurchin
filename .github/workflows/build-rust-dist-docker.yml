name: Build Rust Dist Container

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - dev-18

jobs:
  build-rust:
    if: github.repository_owner == 'seahorn'
    runs-on: seaurchin-big
    container:
      image: ghcr.io/seahorn/seaurchin-llvm/buildpack-deps-seaurchin:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: read
      contents: read
    outputs:
      seaurchin_llvm_run_id: ${{ steps.get_seaurchin_llvm_run.outputs.run_id }}
    env:
      LLVM_ARTIFACT_DIR: seaurchin-llvm
      LLVM_ARTIFACT_FILE: seaurchin-llvm-assert-install-dev18.tar.zst
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS_NOT_BOOTSTRAP: >-
        -Cllvm-args=-licm-uses-ownsem
        -Cllvm-args=-licm-ownsem-safeset-ignores-throw
        -Cllvm-args=-licm-ownsem-safeset-store-threadsafe

    steps:
      - name: Checkout seaurchin
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            src/doc/book \
            src/doc/nomicon \
            src/doc/reference \
            src/doc/rust-by-example \
            src/doc/embedded-book \
            src/doc/edition-guide \
            src/doc/rustc-dev-guide \
            src/tools/cargo \
            library/backtrace \
            library/stdarch

      - name: Get latest successful run ID from seaurchin-llvm
        id: get_seaurchin_llvm_run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: 'seahorn',
              repo: 'seaurchin-llvm',
              workflow_id: 'build-seaurchin-llvm-assert-bin.yml',
              branch: 'dev-18',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              throw new Error('No successful runs found');
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);

      - name: Download seaurchin-llvm-install artifact
        uses: actions/download-artifact@v4
        with:
          name: seaurchin-llvm-assert-install
          path: ${{ env.LLVM_ARTIFACT_DIR }}
          run-id: ${{ steps.get_seaurchin_llvm_run.outputs.run_id }}
          repository: seahorn/seaurchin-llvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack seaurchin-llvm install
        run: |
          tar --zstd -C "$LLVM_ARTIFACT_DIR" -xf "$LLVM_ARTIFACT_DIR/$LLVM_ARTIFACT_FILE"
          rm "$LLVM_ARTIFACT_DIR/$LLVM_ARTIFACT_FILE"

      - name: Build Rust
        run: python3 x.py --config=config.ci.toml install

      - name: Run Rust UI tests
        run: python3 x.py --config=config.ci.toml --stage 2 --target x86_64-unknown-linux-gnu test tests/ui

      - name: Package rust install
        run: tar -C /tmp/mnt -c install/ | zstd -T0 -c > /tmp/rust-install.tar.zst

      - name: Upload rust install
        uses: actions/upload-artifact@v4
        with:
          name: rust-install
          path: /tmp/rust-install.tar.zst
          retention-days: 1
          if-no-files-found: error

  push-toolchain-image:
    needs: build-rust
    if: github.repository_owner == 'seahorn'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      LLVM_ARTIFACT_DIR: seaurchin-llvm
      LLVM_ARTIFACT_FILE: seaurchin-llvm-assert-install-dev18.tar.zst

    steps:
      - name: Checkout seaurchin
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            src/doc/book \
            src/doc/nomicon \
            src/doc/reference \
            src/doc/rust-by-example \
            src/doc/embedded-book \
            src/doc/edition-guide \
            src/doc/rustc-dev-guide \
            src/tools/cargo \
            library/backtrace \
            library/stdarch

      - name: Download seaurchin-llvm-install artifact
        uses: actions/download-artifact@v4
        with:
          name: seaurchin-llvm-assert-install
          path: ${{ env.LLVM_ARTIFACT_DIR }}
          run-id: ${{ needs.build-rust.outputs.seaurchin_llvm_run_id }}
          repository: seahorn/seaurchin-llvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download seaurchin-llvm source artifact
        uses: actions/download-artifact@v4
        with:
          name: seaurchin-llvm-source
          path: /tmp/llvm-source
          run-id: ${{ needs.build-rust.outputs.seaurchin_llvm_run_id }}
          repository: seahorn/seaurchin-llvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack seaurchin-llvm install
        run: |
          tar --zstd -C "$LLVM_ARTIFACT_DIR" -xf "$LLVM_ARTIFACT_DIR/$LLVM_ARTIFACT_FILE"
          rm "$LLVM_ARTIFACT_DIR/$LLVM_ARTIFACT_FILE"

      - name: Download rust install (from build-rust job)
        uses: actions/download-artifact@v4
        with:
          name: rust-install
          path: /tmp/rust-install-archive

      - name: Unpack rust install
        run: |
          mkdir -p /tmp/mnt
          tar --zstd -C /tmp/mnt -xf /tmp/rust-install-archive/rust-install.tar.zst
          rm -rf /tmp/rust-install-archive

      - name: Stage empty docker context
        run: mkdir -p /tmp/empty-ctx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push seaurchin-toolchain image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/empty-ctx
          file: ${{ github.workspace }}/.github/Dockerfile.toolchain
          build-contexts: |
            rust-install=/tmp/mnt/install/usr/local
            llvm-install=${{ github.workspace }}/seaurchin-llvm/install
            rust-source=${{ github.workspace }}
            llvm-source-archive=/tmp/llvm-source
          push: true
          tags: |
            ghcr.io/seahorn/seaurchin-toolchain:dev-18-latest
            ghcr.io/seahorn/seaurchin-toolchain:dev-18-${{ github.sha }}
